name: fitsync_ai
description: "FitSync AI - Smart Fitness Coach that Adapts Daily Targets to Life Load (Exams, Sleep, Stress, Recovery & Cycle)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Backend & Auth
  supabase_flutter: ^2.5.0
  shared_preferences: ^2.2.3

  # UI & Design System
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.20.2
  uuid: ^4.4.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/l10n/
